name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run T1 - build_and_test.py
        run: python build_and_test.py

      - name: Run T2 - auto_test_engine.run_auto_tests
        run: python -c "import auto_test_engine; auto_test_engine.run_auto_tests()"

      - name: Run T3 - generate_report.py
        run: python generate_report.py

      - name: Run T4 - notify_on_failure.py
        run: python notify_on_failure.py
